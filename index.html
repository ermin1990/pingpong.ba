<html lang="bs">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />

  <meta name="mobile-web-app-capable" content="yes" />

    <title>Padel BiH</title>
    <style>
      body {
        /* Defaults handle via Tailwind classes on body or root layout */
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "SF Pro Display", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Override heavy font weights globally for minimalist look */
      .font-black { font-weight: 600 !important; }
      .font-extrabold { font-weight: 600 !important; }
      .font-bold { font-weight: 500 !important; }
      .font-semibold { font-weight: 500 !important; }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #020617;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
